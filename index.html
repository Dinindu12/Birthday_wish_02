<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#feecea">

    <title>Happy Birthday! 🎂</title>

    <!-- Favicon -->
    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>"
    >

    <!-- Font Awesome (integrity removed for compatibility) -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;600&family=Sriracha&family=Titan+One&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery (integrity removed for compatibility) -->
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
        crossorigin="anonymous">
    </script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>

    <!-- App -->
    <script src="js/app.js" defer></script>

</head>

<body class="theme-girl">

    <!-- =====================================
         FIREWORKS CANVAS
    ====================================== -->
    <canvas id="skysticks-canvas"></canvas>


    <!-- =====================================
         BACKGROUND MUSIC
    ====================================== -->
    <audio id="bg-music" loop></audio>


    <!-- =====================================
         ADMIN PANEL BUTTON
    ====================================== -->
    <a href="admin.html" class="admin-float-btn">
        <i class="fa-solid fa-gear"></i>
        <span>Admin Panel</span>
    </a>


    <!-- =====================================
         MAIN WRAPPER
    ====================================== -->
    <div id="wrapper">


        <!-- =================================
             BIRTHDAY FLAGS
        ================================== -->
        <div class="flag__birthday">

            <img
                src="./images/1.png"
                alt="Birthday Flags Left"
                width="350"
                class="flag__left"
            >

            <img
                src="./images/1.png"
                alt="Birthday Flags Right"
                width="350"
                class="flag__right"
            >

        </div>


        <!-- =================================
             MAIN CONTENT
        ================================== -->
        <div class="content">


            <!-- ==============================
                 LEFT SECTION
            =============================== -->
            <div class="left">

                <!-- Birthday Title -->
                <div class="title">

                    <h1 class="happy">

                        <span style="--t: 4s;">H</span>
                        <span style="--t: 4.2s;">a</span>
                        <span style="--t: 4.4s;">p</span>
                        <span style="--t: 4.6s;">p</span>
                        <span style="--t: 4.8s;">y</span>

                    </h1>


                    <h1 class="birthday">

                        <span style="--t: 5s;">B</span>
                        <span style="--t: 5.2s;">i</span>
                        <span style="--t: 5.4s;">r</span>
                        <span style="--t: 5.6s;">t</span>
                        <span style="--t: 5.8s;">h</span>
                        <span style="--t: 6s;">d</span>
                        <span style="--t: 6.2s;">a</span>
                        <span style="--t: 6.4s;">y</span>

                    </h1>


                    <!-- Birthday Hat -->
                    <div class="hat">

                        <img
                            src="./images/hat.png"
                            alt="Birthday Hat"
                            width="130"
                        >

                    </div>

                </div>


                <!-- ==========================
                     DATE
                =========================== -->
                <div class="date__of__birth">

                    <span></span>

                </div>


                <!-- ==========================
                     LETTER BUTTON
                =========================== -->
                <div class="btn">

                    <button id="btn__letter">

                        <div
                            class="mail"
                            id="mail-btn-text"
                        >

                            Click Here

                            <span class="recipient-name">
                                Friend
                            </span>

                            <i class="fa-regular fa-envelope"></i>

                        </div>

                    </button>

                </div>

            </div>


            <!-- ==============================
                 RIGHT SECTION
            =============================== -->
            <div class="right">


                <!-- ==========================
                     PROFILE
                =========================== -->
                <div class="box__account">

                    <div class="image">

                        <img
                            src="./images/unnamed.png"
                            class="profile-photo"
                            alt="Profile Photo"
                        >

                    </div>


                    <!-- Name -->
                    <div class="name">

                        <i class="fa-solid fa-heart"></i>

                        <span>
                            Dear
                            <span class="recipient-name">
                                Friend
                            </span>
                        </span>

                        <i class="fa-solid fa-heart"></i>

                    </div>


                    <!-- Balloon 1 -->
                    <div class="balloon_one">

                        <img
                            width="100"
                            src="./images/balloon1.png"
                            alt="Balloon"
                        >

                    </div>


                    <!-- Balloon 2 -->
                    <div class="balloon_two">

                        <img
                            width="100"
                            src="./images/balloon2.png"
                            alt="Balloon"
                        >

                    </div>

                </div>


                <!-- ==========================
                     ROTATING CIRCLE
                =========================== -->
                <div class="cricle">

                    <div class="text__cricle">
                        <!-- Dynamic text generated by app.js -->
                    </div>

                    <i class="fa-solid fa-heart"></i>

                </div>

            </div>

        </div>


        <!-- =================================
             DECORATION STARS
        ================================== -->

        <div
            class="decorate_star star1"
            style="--t: 15s;"
        ></div>

        <div
            class="decorate_star star2"
            style="--t: 15.2s;"
        ></div>

        <div
            class="decorate_star star3"
            style="--t: 15.4s;"
        ></div>

        <div
            class="decorate_star star4"
            style="--t: 15.6s;"
        ></div>

        <div
            class="decorate_star star5"
            style="--t: 15.8s;"
        ></div>


        <!-- =================================
             FLOWERS
        ================================== -->

        <div
            class="decorate_flower--one"
            style="--t: 15s;"
        >

            <img
                width="20"
                src="./images/decorate_flower.png"
                alt=""
            >

        </div>


        <div
            class="decorate_flower--two"
            style="--t: 15.3s;"
        >

            <img
                width="20"
                src="./images/decorate_flower.png"
                alt=""
            >

        </div>


        <div
            class="decorate_flower--three"
            style="--t: 15.6s;"
        >

            <img
                width="20"
                src="./images/decorate_flower.png"
                alt=""
            >

        </div>


        <!-- =================================
             BOTTOM DECORATION
        ================================== -->

        <div class="decorate_bottom">

            <img
                src="./images/decorate.png"
                alt=""
                width="100"
            >

        </div>


        <!-- =================================
             SMILEY
        ================================== -->

        <div class="smiley__icon">

            <img
                src="./images/smiley_icon.png"
                alt=""
                width="100"
            >

        </div>


        <!-- =================================
             WISH LETTER MODAL
        ================================== -->

        <div class="boxMail">

            <!-- Close -->
            <i class="fa-solid fa-xmark"></i>


            <div class="boxMail-container">


                <!-- ==========================
                     CARD 1
                =========================== -->

                <div class="card1">


                    <div class="userImg">

                        <img
                            src="./images/unnamed.png"
                            class="profile-photo"
                            alt="Profile"
                        >

                    </div>


                    <h4 class="username">

                        To:

                        <span class="recipient-name">
                            Friend
                        </span>

                        💖

                        <span class="underline"></span>

                    </h4>


                    <h3>
                        Happy Birthday
                    </h3>


                    <div class="mewmew-cat">

                        <img
                            src="./images/mewmew.gif"
                            alt="Cute Animated Cat"
                            width="65"
                        >

                    </div>

                </div>


                <!-- ==========================
                     CARD 2
                =========================== -->

                <div class="card2">

                    <div class="card2-content">

                        <h3>
                            To You!
                        </h3>

                        <h2>
                            Wish letter loading...
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <!-- =================================
             FOOTER
        ================================== -->

        <footer class="app-footer">

            <span>
                Kulanima's Plan 📝
            </span>

            <span class="footer-divider">
                |
            </span>

            <span>
                Developed by Dinindu Jayampathi 👨‍💻♨⚛
            </span>

        </footer>


    </div>


</body>

</html>
