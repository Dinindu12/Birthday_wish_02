<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Birthday Wishes 🎂</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Titan+One&family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Sriracha', cursive;
            background: #fef6f5;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 32px;
            padding: 40px 45px;
            box-shadow: 0 20px 60px rgba(255, 120, 130, 0.15);
            border: 1px solid rgba(255, 120, 130, 0.2);
        }
        h1 {
            font-family: 'Titan One', cursive;
            font-size: 2.8rem;
            color: #FF7882;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 #333;
            margin-bottom: 8px;
        }
        .sub-title {
            text-align: center;
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            border-bottom: 2px dashed #f0d0d0;
            padding-bottom: 15px;
        }
        .sub-title i {
            color: #FF7882;
        }

        /* ===== FORM ===== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 30px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-group label i {
            color: #FF7882;
            width: 18px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 10px 14px;
            border: 2px solid #eee;
            border-radius: 14px;
            font-family: 'Sriracha', cursive;
            font-size: 0.95rem;
            background: #fafafa;
            transition: 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #FF7882;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 120, 130, 0.15);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            padding-top: 6px;
        }
        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .radio-group input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #FF7882;
        }
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .color-picker-wrapper input[type="color"] {
            width: 50px;
            height: 50px;
            padding: 2px;
            border-radius: 50%;
            border: 3px solid #ddd;
            cursor: pointer;
            background: none;
        }

        /* ===== BUTTONS ===== */
        .btn-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
            justify-content: center;
        }
        .btn {
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-family: 'Sriracha', cursive;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 3px solid #333;
        }
        .btn-primary {
            background: #FF7882;
            color: #fff;
            box-shadow: 0 6px 0 #333;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #333;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #333;
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            box-shadow: 0 6px 0 #999;
        }
        .btn-secondary:hover {
            background: #d0d0d0;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #ff4444;
            color: #fff;
            box-shadow: 0 6px 0 #aa2222;
        }
        .btn-danger:hover {
            background: #ee3333;
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #333;
            cursor: not-allowed;
        }

        /* ===== GENERATED LINK ===== */
        .link-container {
            margin-top: 25px;
            padding: 20px;
            background: #f0f7ff;
            border-radius: 20px;
            border: 2px dashed #FF7882;
            display: none;
        }
        .link-container.show {
            display: block;
        }
        .link-container label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        .link-container .link-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .link-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ccc;
            border-radius: 12px;
            font-size: 0.9rem;
            background: #fff;
            font-family: 'Sriracha', cursive;
        }
        .link-container .copy-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Sriracha', cursive;
            transition: 0.3s;
        }
        .link-container .copy-btn:hover {
            background: #FF7882;
        }

        /* ===== SCHEDULED LIST ===== */
        .scheduled-section {
            margin-top: 35px;
            border-top: 2px solid #f0e0e0;
            padding-top: 25px;
        }
        .scheduled-section h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #FF7882;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .schedule-item {
            background: #fafafa;
            padding: 12px 18px;
            border-radius: 14px;
            border-left: 6px solid #FF7882;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .schedule-item .info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .schedule-item .info strong {
            color: #333;
        }
        .schedule-item .badge {
            background: #FF7882;
            color: #fff;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 2px solid #333;
        }
        .schedule-item .delete-sched {
            color: #ff4444;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.3s;
            background: none;
            border: none;
        }
        .schedule-item .delete-sched:hover {
            transform: scale(1.2);
        }
        .empty-msg {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .admin-container {
                padding: 20px 16px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2rem;
            }
            .btn-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
            .link-container .link-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>🎂 Admin Panel</h1>
        <p class="sub-title"><i class="fa-regular fa-pen-to-square"></i> Create &amp; Schedule Birthday Wishes</p>

        <!-- ===== FORM ===== -->
        <form id="wishForm" onsubmit="generateLink(event)">
            <div class="form-grid">

                <!-- Name -->
                <div class="form-group">
                    <label><i class="fa-regular fa-user"></i> Name</label>
                    <input type="text" id="wishName" placeholder="e.g. Dinindu" value="Friend" />
                </div>

                <!-- Date of Birth -->
                <div class="form-group">
                    <label><i class="fa-regular fa-calendar"></i> Date of Birth</label>
                    <input type="date" id="wishDate" />
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label><i class="fa-regular fa-face-smile"></i> Gender</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="girl" checked /> 👧 Girl</label>
                        <label><input type="radio" name="gender" value="boy" /> 👦 Boy</label>
                    </div>
                </div>

                <!-- Photo URL -->
                <div class="form-group">
                    <label><i class="fa-regular fa-image"></i> Photo URL</label>
                    <input type="text" id="wishPhoto" placeholder="./images/unnamed.png" value="./images/unnamed.png" />
                </div>

                <!-- Card Title -->
                <div class="form-group">
                    <label><i class="fa-regular fa-rectangle-ad"></i> Card Title</label>
                    <input type="text" id="wishCardTitle" placeholder="Happy Birthday!" value="Happy Birthday!" />
                </div>

                <!-- Theme Color -->
                <div class="form-group">
                    <label><i class="fa-regular fa-palette"></i> Theme Color</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="wishThemeColor" value="#FF7882" />
                        <span id="colorDisplay" style="font-size:0.9rem;">#FF7882</span>
                    </div>
                </div>

                <!-- Music URL -->
                <div class="form-group full-width">
                    <label><i class="fa-regular fa-music"></i> Background Music URL</label>
                    <input type="text" id="wishMusic" placeholder="https://...mp3" value="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" />
                </div>

                <!-- Wish Letter -->
                <div class="form-group full-width">
                    <label><i class="fa-regular fa-envelope"></i> Wish Letter</label>
                    <textarea id="wishLetter" placeholder="Write your heartfelt birthday message here...">Wishing you a day filled with love, joy, and lots of cake! 🎂✨</textarea>
                </div>

                <!-- Target Date (Scheduling) -->
                <div class="form-group full-width">
                    <label><i class="fa-regular fa-clock"></i> Schedule for Date (Optional)</label>
                    <input type="date" id="wishTargetDate" />
                    <small style="color:#888;">Leave empty to create an unscheduled wish.</small>
                </div>

            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-primary" id="generateBtn">
                    <i class="fa-regular fa-link"></i> Generate Link
                </button>
                <button type="button" class="btn btn-danger" onclick="clearAllStorage()">
                    <i class="fa-regular fa-trash-can"></i> Clear Storage
                </button>
            </div>
        </form>

        <!-- ===== GENERATED LINK OUTPUT ===== -->
        <div class="link-container" id="linkContainer">
            <label><i class="fa-regular fa-link"></i> Your Shareable Link:</label>
            <div class="link-box">
                <input type="text" id="generatedLink" readonly />
                <button class="copy-btn" onclick="copyLink()"><i class="fa-regular fa-copy"></i> Copy</button>
            </div>
        </div>

        <!-- ===== SCHEDULED BIRTHDAYS LIST ===== -->
        <div class="scheduled-section">
            <h3><i class="fa-regular fa-calendar-check"></i> Scheduled Wishes</h3>
            <div id="scheduledList"></div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT - FULL FIX (QuotaExceededError HANDLED)            -->
    <!-- ============================================================ -->
    <script>
        // ============================================
        // FIREBASE CONFIG (Your provided config)
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBD1DyGnvlNoDRwumUsnHKsU1TbBo-39fs",
            authDomain: "birthday-wishes-3f440.firebaseapp.com",
            projectId: "birthday-wishes-3f440",
            storageBucket: "birthday-wishes-3f440.firebasestorage.app",
            messagingSenderId: "196544487511",
            appId: "1:196544487511:web:6604014975e99a7ec9c312"
        };

        // Init Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // ============================================
        // SAFE LOCALSTORAGE SETTER (FIXES QUOTA ERROR)
        // ============================================
        function safeSetItem(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    console.warn('⚠️ Storage quota exceeded for key:', key);

                    // Auto-cleanup strategy: remove oldest scheduled items
                    try {
                        const raw = localStorage.getItem('scheduled_birthdays');
                        if (raw) {
                            const list = JSON.parse(raw);
                            if (Array.isArray(list) && list.length > 3) {
                                // Keep only latest 3 to free space
                                const trimmed = list.slice(-3);
                                localStorage.setItem('scheduled_birthdays', JSON.stringify(trimmed));
                                // Try saving again
                                localStorage.setItem(key, JSON.stringify(value));
                                return true;
                            }
                        }
                        // If that fails, clear everything
                        localStorage.clear();
                        localStorage.setItem(key, JSON.stringify(value));
                        return true;
                    } catch (finalErr) {
                        alert('⚠️ ඔබගේ බ්‍රවුසරයේ ගබඩාව සම්පූර්ණයෙන්ම පිරී ඇත.\nකරුණාකර "Clear Storage" බොත්තම ඔබා නැවත උත්සාහ කරන්න.');
                        return false;
                    }
                }
                console.error('Unexpected localStorage error:', e);
                return false;
            }
        }

        // ============================================
        // GENERATE LINK (MAIN FUNCTION)
        // ============================================
        async function generateLink(event) {
            event.preventDefault();

            // --- Get form values ---
            const name = document.getElementById('wishName').value.trim() || "Friend";
            const date = document.getElementById('wishDate').value || "";
            const gender = document.querySelector('input[name="gender"]:checked')?.value || "girl";
            const photo = document.getElementById('wishPhoto').value.trim() || "./images/unnamed.png";
            const cardTitle = document.getElementById('wishCardTitle').value.trim() || "Happy Birthday!";
            const letterText = document.getElementById('wishLetter').value.trim() || "Wishing you a wonderful day!";
            const themeColor = document.getElementById('wishThemeColor').value || "#FF7882";
            const music = document.getElementById('wishMusic').value.trim() || "";
            const targetDate = document.getElementById('wishTargetDate').value || "";

            // Update color display
            document.getElementById('colorDisplay').textContent = themeColor;

            const wishData = {
                name,
                date,
                gender,
                photo,
                cardTitle,
                letterText,
                themeColor,
                music,
                targetDate,
                createdAt: new Date().toISOString()
            };

            // --- UI Loading ---
            const btn = document.getElementById('generateBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-regular fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            let firestoreId = null;
            let savedToFirebase = false;

            try {
                // 1. TRY: Save to Firebase Firestore
                const docRef = await db.collection('wishes').add({
                    ...wishData,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                firestoreId = docRef.id;
                savedToFirebase = true;
                console.log('✅ Wish saved to Firebase! ID:', firestoreId);
            } catch (firebaseError) {
                console.error('❌ Firebase Save Error:', firebaseError);
                savedToFirebase = false;
                // Continue to localStorage fallback
            }

            // 2. ALWAYS: Save to localStorage safely (backup + scheduling)
            const savedLocal = safeSetItem('last_created_wish', wishData);

            // 3. Handle Scheduling (targetDate)
            if (targetDate) {
                let scheduledList = [];
                try {
                    const raw = localStorage.getItem('scheduled_birthdays');
                    scheduledList = raw ? JSON.parse(raw) : [];
                } catch (e) { scheduledList = []; }

                // Avoid duplicates
                const exists = scheduledList.some(item =>
                    item.targetDate === targetDate && item.name === name
                );

                if (!exists) {
                    const newEntry = {
                        ...wishData,
                        targetDate: targetDate,
                        firestoreId: firestoreId || null
                    };
                    scheduledList.push(newEntry);

                    // ⚠️ CRITICAL FIX: Keep only latest 10 to prevent quota issues
                    if (scheduledList.length > 10) {
                        scheduledList = scheduledList.slice(-10);
                    }
                    safeSetItem('scheduled_birthdays', scheduledList);
                }
            }

            // 4. Generate the shareable link
            let link = '';
            if (savedToFirebase && firestoreId) {
                const base = window.location.origin + window.location.pathname.replace('admin.html', 'index.html');
                link = `${base}?id=${firestoreId}`;
            } else {
                // Fallback: use localStorage preview link
                const base = window.location.origin + window.location.pathname.replace('admin.html', 'index.html');
                link = `${base} (Saved locally - Firebase unavailable)`;
            }

            // 5. Display link
            const linkContainer = document.getElementById('linkContainer');
            const linkInput = document.getElementById('generatedLink');
            linkInput.value = link;
            linkContainer.classList.add('show');

            // 6. Refresh scheduled list
            renderScheduledList();

            // 7. Final message
            if (savedToFirebase) {
                alert(`🎉 Wish saved successfully to Firebase & LocalStorage!\n\nShare this link:\n${link}`);
            } else {
                alert(`⚠️ Saved to LocalStorage only (Firebase error).\n\nView at:\n${link}`);
            }

            // Reset button
            btn.innerHTML = originalText;
            btn.disabled = false;
        }

        // ============================================
        // COPY LINK TO CLIPBOARD
        // ============================================
        function copyLink() {
            const input = document.getElementById('generatedLink');
            if (!input.value) return;
            navigator.clipboard.writeText(input.value).then(() => {
                alert('✅ Link copied to clipboard!');
            }).catch(() => {
                input.select();
                document.execCommand('copy');
                alert('✅ Link copied!');
            });
        }

        // ============================================
        // CLEAR ALL STORAGE (Manual fix for quota)
        // ============================================
        function clearAllStorage() {
            if (confirm('⚠️ Are you sure you want to clear ALL localStorage data?\nThis will remove all saved wishes and schedules.')) {
                localStorage.clear();
                renderScheduledList();
                document.getElementById('linkContainer').classList.remove('show');
                alert('✅ LocalStorage cleared successfully!');
            }
        }

        // ============================================
        // RENDER SCHEDULED BIRTHDAYS LIST
        // ============================================
        function renderScheduledList() {
            const container = document.getElementById('scheduledList');
            let list = [];
            try {
                const raw = localStorage.getItem('scheduled_birthdays');
                list = raw ? JSON.parse(raw) : [];
            } catch (e) { list = []; }

            if (list.length === 0) {
                container.innerHTML = '<div class="empty-msg">📭 No scheduled wishes yet.</div>';
                return;
            }

            let html = '';
            list.forEach((item, index) => {
                const dateDisplay = item.targetDate || 'No date';
                const nameDisplay = item.name || 'Friend';
                const genderEmoji = item.gender === 'boy' ? '💙' : '💖';
                html += `
                    <div class="schedule-item">
                        <div class="info">
                            <strong>${nameDisplay}</strong> ${genderEmoji}
                            <span>📅 ${dateDisplay}</span>
                            <span class="badge">${item.firestoreId ? '☁️ Synced' : '💾 Local'}</span>
                        </div>
                        <button class="delete-sched" onclick="removeScheduled(${index})" title="Remove this schedule">
                            <i class="fa-regular fa-circle-xmark"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ============================================
        // REMOVE INDIVIDUAL SCHEDULED ITEM
        // ============================================
        function removeScheduled(index) {
            if (!confirm('Remove this scheduled wish?')) return;
            let list = [];
            try {
                const raw = localStorage.getItem('scheduled_birthdays');
                list = raw ? JSON.parse(raw) : [];
            } catch (e) { list = []; }

            if (index >= 0 && index < list.length) {
                list.splice(index, 1);
                safeSetItem('scheduled_birthdays', list);
                renderScheduledList();
            }
        }

        // ============================================
        // COLOR PICKER LIVE PREVIEW
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            const colorPicker = document.getElementById('wishThemeColor');
            const colorDisplay = document.getElementById('colorDisplay');
            if (colorPicker && colorDisplay) {
                colorPicker.addEventListener('input', function() {
                    colorDisplay.textContent = this.value;
                });
            }

            // Load scheduled list on page load
            renderScheduledList();
        });
    </script>

</body>
</html>
